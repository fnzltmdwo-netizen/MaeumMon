name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest MaeumMon ZIP
        id: findzip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(ls -1t MaeumMon_*.zip | head -n 1)
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.findzip.outputs.zip }}" -d extracted
          echo "Extracted ZIP contents:"
          find extracted -maxdepth 3 -type f | head -n 80

      - name: Locate Gradle project root
        id: project
        shell: bash
        run: |
          set -e
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found in extracted ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -e
          APK_FILE=$(find "${{ steps.project.outputs.dir }}" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "APK not found after build"
            exit 1
          fi
          mkdir -p out
          cp "$APK_FILE" out/MaeumMon-debug.apk
          echo "apk=out/MaeumMon-debug.apk" >> "$GITHUB_OUTPUT"
          ls -lh out/MaeumMon-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaeumMon-debug-apk
          path: out/MaeumMon-debug.apk
          if-no-files-found: error
          retention-days: 30
