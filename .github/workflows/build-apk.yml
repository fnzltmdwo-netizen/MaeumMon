name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "*.zip"
      - "patches/*.patch"
      - "scripts/*.py"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest MaeumMon ZIP
        id: findzip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(ls -1t MaeumMon_*.zip | head -n 1)
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Using ZIP: $ZIP_FILE"

      - name: Extract project
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q "${{ steps.findzip.outputs.zip }}" -d extracted

      - name: Locate Gradle project root
        id: project
        run: |
          set -e
          GRADLEW=$(find extracted -type f -name gradlew | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply version patches in order
        run: |
          set -e
          cd "${{ steps.project.outputs.dir }}"
          mapfile -t PATCHES < <(find "$GITHUB_WORKSPACE/patches" -maxdepth 1 -type f -name 'v*.patch' | sort -V)
          for PATCH_FILE in "${PATCHES[@]}"; do patch -p1 < "$PATCH_FILE"; done

      - name: Apply v10.18.6 relationship PT consolidation
        run: python3 scripts/apply_v10_18_6.py
      - name: Apply v10.18.7 wording and first-step UX
        run: python3 scripts/apply_v10_18_7.py
      - name: Apply v10.18.8 final PT consolidation
        run: python3 scripts/apply_v10_18_8.py
      - name: Apply v10.18.9 JSON recovery
        run: python3 scripts/apply_v10_18_9.py
      - name: Apply v10.18.10 hard relationship-signal merge
        run: python3 scripts/apply_v10_18_10.py
      - name: Apply v10.18.11 cute pastel UI refresh
        run: python3 scripts/apply_v10_18_11_cute_design.py
      - name: Apply v10.18.12 unified PT sync and mascot bubble fix
        run: python3 scripts/apply_v10_18_12.py
      - name: Apply v10.18.13 young Seungjae tone and settings
        run: python3 scripts/apply_v10_18_13_mascot_widget_settings.py
      - name: Apply v10.18.14 OpenAI API key accordion
        run: python3 scripts/apply_v10_18_14_api_key_accordion.py
      - name: Apply v10.18.15 mascot tap voice toggle
        run: python3 scripts/apply_v10_18_15_voice_toggle.py
      - name: Apply v10.18.16 visible bubble TTS
        run: python3 scripts/apply_v10_18_16_voice_reads_visible_bubble.py
      - name: Apply v10.18.17 young Seungjae everyday-language glossary
        run: python3 scripts/apply_v10_18_17_young_tone_glossary.py
      - name: Apply v10.18.18 move Typecast settings
        run: python3 scripts/apply_v10_18_18_move_typecast_settings.py
      - name: Apply v10.18.19 mascot natural tone only
        run: python3 scripts/apply_v10_18_19_mascot_natural_tone.py
      - name: Apply v10.18.20 home friend settings integration
        run: python3 scripts/apply_v10_18_20_home_friend_settings.py
      - name: Apply v10.18.21 backup restore settings tab
        run: python3 scripts/apply_v10_18_21_backup_restore_settings.py
      - name: Apply v10.18.22 medical PT hard filter and child mascot voice
        run: python3 scripts/apply_v10_18_22_medical_filter_child_voice.py
      - name: Apply v10.18.23 preserve nonmedical PTs
        run: python3 scripts/apply_v10_18_23_preserve_nonmedical_pts.py
      - name: Apply v10.18.24 home-only mascot, longer widget and medical split
        run: python3 scripts/apply_v10_18_24_home_only_long_widget_medical_split.py
      - name: Apply v10.18.25 widget clock clipping fix
        run: python3 scripts/apply_v10_18_25_clock_clip_fix.py
      - name: Apply v10.18.26 widget PT bottom clipping fix
        run: python3 scripts/apply_v10_18_26_widget_pt_bottom_clip_fix.py
      - name: Apply v10.18.27 widget full text and home mascot fix
        run: python3 scripts/apply_v10_18_27_widget_fulltext_home_mascot_fix.py
      - name: Apply v10.18.28 structural widget and mascot fix
        run: python3 scripts/apply_v10_18_28b_structural_widget_mascot_fix.py
      - name: Apply v10.18.29 corpus-distilled warm clear Mind PT
        run: python3 scripts/apply_v10_18_29_oh_style_pt.py
      - name: Apply v10.18.30 importance-ranked counseling memory engine
        run: python3 scripts/apply_v10_18_30_importance_memory_engine.py
      - name: Apply v10.18.31 adaptive counseling follow-up PT loop
        run: python3 scripts/apply_v10_18_31_adaptive_followup_pt_loop.py
      - name: Apply v10.18.32 counseling director and full-app redesign
        run: python3 scripts/apply_v10_18_32_counseling_director_redesign.py
      - name: Apply v10.18.33 shared current counseling focus hub
        run: python3 scripts/apply_v10_18_33_current_focus_hub.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore persistent app signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: maeummon-persistent-debug-signing-v1

      - name: Ensure persistent app signing key
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x ./gradlew
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          set -e
          APK_FILE=$(find "${{ steps.project.outputs.dir }}" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          mkdir -p out
          cp "$APK_FILE" out/MaeumMon-v10.18.33.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaeumMon-v10.18.33-apk
          path: out/MaeumMon-v10.18.33.apk
          if-no-files-found: error
