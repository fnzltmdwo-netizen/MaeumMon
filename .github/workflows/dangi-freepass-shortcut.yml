name: Build Dangi FreePass Shortcut APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'dangi-freepass-shortcut/**'
      - '.github/workflows/dangi-freepass-shortcut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint and build signed debug APK
        run: gradle -p dangi-freepass-shortcut clean :app:lintDebug :app:assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: Verify exact-label matcher is packaged
        run: |
          unzip -p dangi-freepass-shortcut/app/build/outputs/apk/debug/app-debug.apk classes.dex classes2.dex \
            | strings \
            | grep -F 'getContentDescription'

      - name: Verify Android APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs dangi-freepass-shortcut/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare final APK
        run: cp dangi-freepass-shortcut/app/build/outputs/apk/debug/app-debug.apk DangiFreePassShortcut-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DangiFreePassShortcut-v1.0
          path: DangiFreePassShortcut-v1.0.apk
          if-no-files-found: error
          retention-days: 7
